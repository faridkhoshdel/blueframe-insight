services:
  - type: web
    name: blueframe-backend
    runtime: node
    region: frankfurt
    plan: free
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        fromDatabase:
          name: blueframe-db
          property: connectionString

databases:
  - name: blueframe-db
    databaseName: blueframe
    region: frankfurt
    plan: free
